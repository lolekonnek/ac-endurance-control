name: Build Windows client package

on:
  workflow_dispatch:
  push:
    tags:
      - 'client-v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build token-free client ZIP
        run: python tools/package_client.py --output dist/AC-Endurance-Control-Client.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AC-Endurance-Control-Client
          path: dist/AC-Endurance-Control-Client.zip
          if-no-files-found: error
